name: "UM:User Reviews - Code Quality Checker"

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coding-standards:
    name: "Coding standards (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    steps:
      # node24 runtime
      - name: Checkout
        uses: actions/checkout@v5

      # node24 runtime
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Matches the ext-* entries in composer.json.
          extensions: json, dom, exif, gd, fileinfo, curl, iconv
          coverage: none
          tools: composer:v2, cs2pr

      - name: Validate composer.json
        run: composer validate --strict --no-check-all

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # node24 runtime — replaces ramsey/composer-install, which still
      # pins actions/cache@v4 (node20) internally.
      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCS
        run: vendor/bin/phpcs -q --standard=phpcs.xml --report=checkstyle . | cs2pr
